# ----------------------------
# Project metadata
# ----------------------------
project:
  name: Tissue_culture_effect
  organism: human

# ----------------------------
# Input data
# ----------------------------
input:
  base_dir: /mnt/odap-beegfs/a008/05_DGE_bulk/tests/261005_NP_tissue_culture_effect
  data_dir: /mnt/odap-beegfs/a008/05_DGE_bulk/data/raw
  merged: /mnt/odap-beegfs/a008/05_DGE_bulk/data/merged

# ----------------------------
# Ingest / metadata mapping
# ----------------------------
ingest:
  default:
    sample_id_col: sample_id
    donor_id_col: donor_id
    condition_col: condition
    batch_col: plate
    raw_cell_id_cols:
      parse_splitpipe: bc_wells
      standard_matrix: orig.ident
      h5ad: cell_id

# ----------------------------
# Cell set definition
# ----------------------------
cell_sets:

  Conditions:
    where: "condition %in% c('Uncultured', 'Post_Equilibration', 'Media_Standard_6_hrs', 'Media_Standard_18_hrs', 'Media_Standard_24_hrs')"

  Lung:
    where: "tissue == 'Lung'"

  Skin:
    where: "tissue == 'Skin'"

  Brain:
    where: "tissue == 'Brain'"

  Lung_sub:
    algebra: "Conditions AND Lung"

  Skin_sub:
    algebra: "Conditions AND Skin"

  Brain_sub:
    algebra: "Conditions AND Brain"

# ----------------------------
# Pseudobulk
# ----------------------------

pseudobulk:

  aggregation:
    unit_col: sample_id        # column used as pseudobulk unit
    donor_col: donor_id
    condition_col: condition
    batch_col: batch

  filtering:

    units:
      min_cells_per_unit: 50
      min_total_counts_per_unit: 0

    genes:
      use_group_for_filter: true   # pass condition to filterByExpr

  downsampling:
    enabled: false
    max_cells_per_unit: 2000
    seed: 1

# ----------------------------
# Differential expression
# ----------------------------

dge:
  default_engine: "edgeR_qlf"
  engines:
    edgeR_qlf:
      description: "edgeR quasi-likelihood GLM per cell set"
      required_packages: ["edgeR"]
      outputs:
        - result_table
        - model_json
        - diagnostics

  design:
    formula: "~ batch + condition"
    reference_levels:
      condition: "Uncultured"
    covariates_optional: ["sex", "age"]

  tests:

    # Global condition effect (multi-df)
    - name: condition_global
      type: coef_set
      coefficients: ["conditionPost_Equilibration", "conditionMedia_Standard_6_hrs", "conditionMedia_Standard_18_hrs", "conditionMedia_Standard_24_hrs"]
      cell_sets: ["Lung_sub", "Skin_sub", "Brain_sub"]

    # Simple pairwise
    - name: Post_Equilibration_vs_control
      type: contrast
      contrast: "conditionPost_Equilibration"
      cell_sets: ["Lung_sub", "Skin_sub", "Brain_sub"]

    - name: Media_6h_vs_control
      type: contrast
      contrast: "conditionMedia_Standard_6_hrs"
      cell_sets: ["Lung_sub", "Skin_sub", "Brain_sub"]

    - name: Media_18h_vs_control
      type: contrast
      contrast: "conditionMedia_Standard_18_hrs"
      cell_sets: ["Lung_sub", "Skin_sub", "Brain_sub"]

    - name: Media_24h_vs_control
      type: contrast
      contrast: "conditionMedia_Standard_24_hrs"
      cell_sets: ["Lung_sub", "Skin_sub", "Brain_sub"]

  constraints:
    min_units_per_level: 2
    min_total_units: 4
    multiple_testing: BH

  result_table_schema:
    required_columns:
      - gene_id
      - logFC
      - PValue
      - FDR
